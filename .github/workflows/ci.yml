name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux, Qt 6",          os: ubuntu-24.04, qt: "6.8.3" }
          - { name: "Linux, Qt 5.15",       os: ubuntu-22.04, qt: "5.15.2" }
          - { name: "Windows MSVC, Qt 6",   os: windows-2022, qt: "6.8.3",  arch: win64_msvc2022_64 }
          - { name: "Windows MSVC, Qt 5.15", os: windows-2022, qt: "5.15.2", arch: win64_msvc2019_64 }
          - { name: "Windows MinGW, Qt 6",  os: windows-2022, qt: "6.8.3",  arch: win64_mingw, tools: "tools_mingw1310" }
          - { name: "macOS, Qt 6",          os: macos-14,     qt: "6.8.3" }
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          tools: ${{ matrix.tools }}
          add-tools-to-path: true
          cache: true

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1 fonts-liberation

      - name: Set up MSVC
        if: contains(matrix.arch, 'msvc')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
